name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Needed so electron-builder can upload assets to the GitHub Release on tag builds.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: dist/*.exe dist/*.blockmap
          - os: macos-latest
            target: mac
            artifact: dist/*.dmg dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            artifact: dist/*.deb dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev fakeroot rpm
      - run: npm ci
      - run: npm run build
      # On a v* tag: build AND publish binaries to the GitHub Release for that tag.
      # On main / manual runs: build only (CI sanity check, no publish).
      - name: Build and publish (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only (CI check)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-manager-${{ matrix.os }}
          path: ${{ matrix.artifact }}
